<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file: blob: data:; script-src 'self' file: blob:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' file: data:; connect-src 'self' file: data: blob:; worker-src 'self' file: blob:; object-src 'none'; base-uri 'none';"
    />
    <title>PDFReader</title>
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <header class="toolbar">
      <button id="btn-sidebar" class="tool" title="Боковая панель (F4)" aria-label="Боковая панель">
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.5" d="M3.25 4.25h13.5v11.5H3.25zM8 4.25v11.5" />
        </svg>
      </button>
      <button id="btn-open" class="tool" title="Открыть (Ctrl+O)" aria-label="Открыть">
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
          <path
            d="M2.5 5.25A1.75 1.75 0 0 1 4.25 3.5h3.2c.46 0 .9.18 1.23.51l1.06 1.06h6.01c.97 0 1.75.78 1.75 1.75v8.43c0 .97-.78 1.75-1.75 1.75H4.25a1.75 1.75 0 0 1-1.75-1.75Z"
            fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
        </svg>
      </button>

      <span class="sep" aria-hidden="true"></span>

      <button id="btn-prev" class="tool" title="Предыдущая страница" aria-label="Предыдущая страница">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.8" d="m12.5 4-5 6 5 6" />
        </svg>
      </button>
      <span class="pager">
        <input id="page-input" class="page-input" type="text" inputmode="numeric" value="—"
               aria-label="Номер страницы" />
        <span class="page-total">/ <span id="page-count">—</span></span>
      </span>
      <button id="btn-next" class="tool" title="Следующая страница" aria-label="Следующая страница">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.8" d="m7.5 4 5 6-5 6" />
        </svg>
      </button>

      <span class="sep" aria-hidden="true"></span>

      <button id="btn-zoom-out" class="tool" title="Уменьшить (Ctrl+-)" aria-label="Уменьшить">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.8" d="M4.5 10h11" />
        </svg>
      </button>
      <select id="zoom-select" class="zoom" aria-label="Масштаб">
        <option value="fit-width">По ширине</option>
        <option value="fit-page">Страница целиком</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="3">300%</option>
        <option value="custom" hidden>—</option>
      </select>
      <button id="btn-zoom-in" class="tool" title="Увеличить (Ctrl+=)" aria-label="Увеличить">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.8" d="M10 4.5v11M4.5 10h11" />
        </svg>
      </button>

      <span class="spacer"></span>

      <div id="find-box" class="find" hidden>
        <input id="find-input" class="find-input" type="search" placeholder="Найти в документе"
               aria-label="Найти в документе" />
        <span id="find-status" class="find-status"></span>
        <button id="find-prev" class="tool" title="Предыдущее совпадение" aria-label="Предыдущее совпадение">
          <svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.8" d="m4 12.5 6-5 6 5" />
          </svg>
        </button>
        <button id="find-next" class="tool" title="Следующее совпадение" aria-label="Следующее совпадение">
          <svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.8" d="m4 7.5 6 5 6-5" />
          </svg>
        </button>
        <button id="find-close" class="tool" title="Закрыть поиск" aria-label="Закрыть поиск">
          <svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.8" d="m5 5 10 10M15 5 5 15" />
          </svg>
        </button>
      </div>

      <button id="btn-find" class="tool" title="Найти (Ctrl+F)" aria-label="Найти">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
          <circle cx="9" cy="9" r="4.75" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path fill="none" stroke="currentColor" stroke-width="1.8" d="m12.6 12.6 3.4 3.4" />
        </svg>
      </button>
      <button id="btn-print" class="tool" title="Печать (Ctrl+P)" aria-label="Печать">
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"
                d="M6 7.5V3.25h8V7.5M6 14.5H4.25A1.25 1.25 0 0 1 3 13.25V8.75A1.25 1.25 0 0 1 4.25 7.5h11.5A1.25 1.25 0 0 1 17 8.75v4.5a1.25 1.25 0 0 1-1.25 1.25H14M6 12h8v4.75H6z" />
        </svg>
      </button>
      <button id="btn-fullscreen" class="tool" title="Во весь экран (F11)" aria-label="Во весь экран">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.6"
                d="M3.5 7.5v-4h4M16.5 7.5v-4h-4M3.5 12.5v4h4M16.5 12.5v4h-4" />
        </svg>
      </button>
    </header>

    <div class="body">
      <aside id="sidebar" class="sidebar" hidden>
        <div class="side-tabs" role="tablist">
          <button id="tab-thumbs" class="side-tab active" role="tab">Страницы</button>
          <button id="tab-outline" class="side-tab" role="tab">Оглавление</button>
        </div>
        <div id="thumbs" class="thumbs" role="tabpanel"></div>
        <div id="outline" class="outline" role="tabpanel" hidden></div>
      </aside>

      <main id="scroller" class="scroller" tabindex="0">
        <div id="sheet" class="sheet"></div>
      </main>
    </div>

    <div id="empty" class="empty">
      <div class="empty-card">
        <h1>PDFReader</h1>
        <p>Откройте документ или перетащите его в окно.</p>
        <button id="empty-open" class="primary">Открыть PDF</button>
        <div id="empty-recent" class="empty-recent"></div>
      </div>
    </div>

    <div id="print-dialog" class="modal" hidden>
      <div class="modal-card" role="dialog" aria-label="Печать">
        <h2>Печать</h2>
        <label class="radio">
          <input type="radio" name="print-range" value="all" checked />
          <span>Все страницы</span>
        </label>
        <label class="radio">
          <input type="radio" name="print-range" value="range" />
          <span>С</span>
          <input id="print-from" class="num" type="number" min="1" value="1" aria-label="С какой страницы" />
          <span>по</span>
          <input id="print-to" class="num" type="number" min="1" value="1" aria-label="По какую страницу" />
        </label>
        <p id="print-error" class="error" hidden></p>
        <div class="modal-buttons">
          <button id="print-cancel" class="plain">Отмена</button>
          <button id="print-go" class="primary">Печать</button>
        </div>
      </div>
    </div>

    <script type="module" src="viewer.js"></script>
  </body>
</html>
